<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
        display: flex; flex-direction: column; justify-content: space-between;
        font-family: Inter, "Segoe UI", Arial, sans-serif; color: #fff;
        background: radial-gradient(circle at 88% 10%, rgb(34 211 238 / 0.35), transparent 35%),
          linear-gradient(135deg, #08111f, #101a2f);
      }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 800; }
      .mark { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
        background: linear-gradient(135deg, #1d4ed8, #22d3ee); font-size: 36px; }
      h1 { margin: 0; max-width: 16ch; font-size: 76px; line-height: 1.02; letter-spacing: -0.04em; }
      p { margin: 0; font-size: 30px; color: rgb(255 255 255 / 0.75); }
      .pills { display: flex; gap: 14px; }
      .pills span { padding: 10px 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.2);
        background: rgb(255 255 255 / 0.08); font-size: 24px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="mark">R</span>Responin</div>
    <h1>Berhenti menjadi sistem operasi untuk bisnismu.</h1>
    <div class="pills"><span>✓ Satu alur kerja dulu</span><span>✓ Persetujuan manusia</span><span>✓ Log audit</span></div>
  </body>
</html>
