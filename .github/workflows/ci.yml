name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site checks (i18n parity, links, claims guardrail)
        run: node scripts/check.mjs
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html
