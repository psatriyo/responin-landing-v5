name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site checks
        run: node scripts/check.mjs
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html
      - name: Assemble site (public files only)
        run: |
          mkdir -p _site
          cp -r index.html 404.html styles.css script.js favicon.svg robots.txt sitemap.xml \
            site.webmanifest CNAME .nojekyll i18n assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
