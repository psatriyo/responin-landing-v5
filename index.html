<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
      data-i18n-meta="description"
    />
    <title data-i18n-title></title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="" data-i18n-attr="aria-label:brand.home">
        <span class="brand__mark" aria-hidden="true">R</span>
        <span>Responin</span>
      </a>
      <nav class="site-nav" aria-label="" data-i18n-attr="aria-label:nav.primary">
        <a href="#workflows" data-i18n="nav.workflows"></a>
        <a href="#process" data-i18n="nav.process"></a>
        <a href="#trust" data-i18n="nav.trust"></a>
        <a href="#pilot" data-i18n="nav.pilot"></a>
      </nav>
      <div class="site-header__actions">
        <div class="language-switcher" aria-label="" data-i18n-attr="aria-label:language.label">
          <button type="button" class="language-switcher__button" data-lang="id">ID</button>
          <button type="button" class="language-switcher__button" data-lang="en">EN</button>
        </div>
        <a class="button button--primary site-header__cta" href="#pilot" data-i18n="cta.startOne"></a>
      </div>
    </header>

    <main>
      <section class="hero-section" id="top" aria-labelledby="hero-title">
        <div class="hero-section__content">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <p class="hero-section__description" data-i18n="hero.description"></p>
          <div class="hero-section__actions" aria-label="" data-i18n-attr="aria-label:hero.actionsLabel">
            <a class="button button--primary" href="#pilot" data-i18n="cta.startOne"></a>
            <a class="button button--secondary" href="#process" data-i18n="cta.seeHow"></a>
          </div>
          <ul class="hero-section__proof" aria-label="" data-i18n-attr="aria-label:hero.proofLabel">
            <li data-i18n="hero.proof.memory"></li>
            <li data-i18n="hero.proof.approval"></li>
            <li data-i18n="hero.proof.audit"></li>
          </ul>
        </div>

        <div class="hero-panel" aria-label="" data-i18n-attr="aria-label:hero.panelLabel">
          <div class="hero-panel__bar" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="hero-panel__body">
            <p class="hero-panel__label" data-i18n="queue.label"></p>
            <div class="workflow-card workflow-card--active">
              <span data-i18n="queue.invoice"></span>
              <strong data-i18n="queue.needsApproval"></strong>
            </div>
            <div class="workflow-card">
              <span data-i18n="queue.escalation"></span>
              <strong data-i18n="queue.routed"></strong>
            </div>
            <div class="workflow-card">
              <span data-i18n="queue.summary"></span>
              <strong data-i18n="queue.ready"></strong>
            </div>
          </div>
        </div>

        <div class="metric-strip" aria-label="" data-i18n-attr="aria-label:metrics.label">
          <article class="metric-card">
            <strong>1</strong>
            <span data-i18n="metrics.oneTitle"></span>
            <p data-i18n="metrics.oneBody"></p>
          </article>
          <article class="metric-card">
            <strong>24/7</strong>
            <span data-i18n="metrics.monitoringTitle"></span>
            <p data-i18n="metrics.monitoringBody"></p>
          </article>
          <article class="metric-card">
            <strong data-i18n="metrics.human"></strong>
            <span data-i18n="metrics.approvalTitle"></span>
            <p data-i18n="metrics.approvalBody"></p>
          </article>
        </div>
      </section>

      <section class="section" id="problems" aria-labelledby="problems-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="problems.eyebrow"></p>
          <h2 id="problems-title" data-i18n="problems.title"></h2>
          <p class="section__description" data-i18n="problems.description"></p>
        </div>
        <div class="problem-grid">
          <article class="card problem-card"><span>01</span><p data-i18n="problems.one"></p></article>
          <article class="card problem-card"><span>02</span><p data-i18n="problems.two"></p></article>
          <article class="card problem-card"><span>03</span><p data-i18n="problems.three"></p></article>
          <article class="card problem-card"><span>04</span><p data-i18n="problems.four"></p></article>
        </div>
      </section>

      <section class="section section--muted" id="workflows" aria-labelledby="workflows-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="principles.eyebrow"></p>
          <h2 id="workflows-title" data-i18n="principles.title"></h2>
          <p class="section__description" data-i18n="principles.description"></p>
        </div>
        <div class="pillar-grid">
          <article class="card pillar-card">
            <h3 data-i18n="principles.learnTitle"></h3>
            <p data-i18n="principles.learnBody"></p>
          </article>
          <article class="card pillar-card">
            <h3 data-i18n="principles.actTitle"></h3>
            <p data-i18n="principles.actBody"></p>
          </article>
          <article class="card pillar-card">
            <h3 data-i18n="principles.safeTitle"></h3>
            <p data-i18n="principles.safeBody"></p>
          </article>
        </div>
      </section>

      <section class="section" id="process" aria-labelledby="process-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="process.eyebrow"></p>
          <h2 id="process-title" data-i18n="process.title"></h2>
          <p class="section__description" data-i18n="process.description"></p>
        </div>
        <ol class="timeline">
          <li class="timeline__item"><span>01</span><p data-i18n="process.one"></p></li>
          <li class="timeline__item"><span>02</span><p data-i18n="process.two"></p></li>
          <li class="timeline__item"><span>03</span><p data-i18n="process.three"></p></li>
          <li class="timeline__item"><span>04</span><p data-i18n="process.four"></p></li>
          <li class="timeline__item"><span>05</span><p data-i18n="process.five"></p></li>
          <li class="timeline__item"><span>06</span><p data-i18n="process.six"></p></li>
        </ol>
      </section>

      <section class="section section--muted" id="use-cases" aria-labelledby="use-cases-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="useCases.eyebrow"></p>
          <h2 id="use-cases-title" data-i18n="useCases.title"></h2>
          <p class="section__description" data-i18n="useCases.description"></p>
        </div>
        <div class="use-case-grid">
          <article class="card use-case-card"><h3 data-i18n="useCases.summaryTitle"></h3><p data-i18n="useCases.summaryBody"></p></article>
          <article class="card use-case-card"><h3 data-i18n="useCases.escalationTitle"></h3><p data-i18n="useCases.escalationBody"></p></article>
          <article class="card use-case-card"><h3 data-i18n="useCases.invoiceTitle"></h3><p data-i18n="useCases.invoiceBody"></p></article>
          <article class="card use-case-card"><h3 data-i18n="useCases.crmTitle"></h3><p data-i18n="useCases.crmBody"></p></article>
        </div>
      </section>

      <section class="section section--dark" id="trust" aria-labelledby="trust-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="trust.eyebrow"></p>
          <h2 id="trust-title" data-i18n="trust.title"></h2>
          <p class="section__description" data-i18n="trust.description"></p>
        </div>
        <ul class="trust-list">
          <li data-i18n="trust.one"></li>
          <li data-i18n="trust.two"></li>
          <li data-i18n="trust.three"></li>
          <li data-i18n="trust.four"></li>
          <li data-i18n="trust.five"></li>
        </ul>
      </section>

      <section class="section" id="faq" aria-labelledby="faq-title">
        <div class="section__header">
          <p class="eyebrow" data-i18n="faq.eyebrow"></p>
          <h2 id="faq-title" data-i18n="faq.title"></h2>
          <p class="section__description" data-i18n="faq.description"></p>
        </div>
        <div class="faq-list">
          <details class="faq-item">
            <summary data-i18n="faq.chatgptQuestion"></summary>
            <p data-i18n="faq.chatgptAnswer"></p>
          </details>
          <details class="faq-item">
            <summary data-i18n="faq.approvalQuestion"></summary>
            <p data-i18n="faq.approvalAnswer"></p>
          </details>
          <details class="faq-item">
            <summary data-i18n="faq.firstQuestion"></summary>
            <p data-i18n="faq.firstAnswer"></p>
          </details>
        </div>
      </section>

      <section class="pilot-cta" id="pilot" aria-labelledby="pilot-title">
        <p class="eyebrow" data-i18n="pilot.eyebrow"></p>
        <h2 id="pilot-title" data-i18n="pilot.title"></h2>
        <p data-i18n="pilot.description"></p>
        <div class="hero-section__actions">
          <a class="button button--primary" href="mailto:hello@responin.ai?subject=Responin%20workflow%20pilot" data-i18n="pilot.start"></a>
          <a class="button button--secondary" href="https://github.com/psatriyo/responin-system-design" target="_blank" rel="noreferrer" data-i18n="pilot.review"></a>
        </div>
      </section>
    </main>

    <script src="i18n/id.js"></script>
    <script src="i18n/en.js"></script>
    <script src="script.js"></script>
  </body>
</html>
